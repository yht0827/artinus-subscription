spring:
  datasource:
    url: jdbc:h2:mem:artinus_subscription;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

external:
  csrng:
    url: https://csrng.net/csrng/csrng.php?min=0&max=1
    connect-timeout: 1s
    read-timeout: 2s

llm:
  enabled: false
  api-key:
  model: gpt-4.1-mini
  max-output-tokens: 180
  connect-timeout: 1s
  read-timeout: 5s
